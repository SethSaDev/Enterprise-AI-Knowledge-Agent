apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-agent-ingress
  namespace: knowledge-agent
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - api.knowledge-agent.com
    - app.knowledge-agent.com
    secretName: tls-secret
  rules:
  - host: api.knowledge-agent.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: knowledge-agent-api
            port:
              number: 3000
  - host: app.knowledge-agent.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: knowledge-agent-web
            port:
              number: 80
