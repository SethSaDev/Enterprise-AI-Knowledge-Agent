apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-agent-api
  namespace: knowledge-agent
  labels:
    app: knowledge-agent
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: knowledge-agent
      component: api
  template:
    metadata:
      labels:
        app: knowledge-agent
        component: api
    spec:
      containers:
      - name: api
        image: knowledge-agent-api:latest
        ports:
        - containerPort: 3000
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-agent-api
  namespace: knowledge-agent
spec:
  selector:
    app: knowledge-agent
    component: api
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  - name: ws
    port: 3001
    targetPort: 3001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-agent-web
  namespace: knowledge-agent
  labels:
    app: knowledge-agent
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowledge-agent
      component: web
  template:
    metadata:
      labels:
        app: knowledge-agent
        component: web
    spec:
      containers:
      - name: web
        image: knowledge-agent-web:latest
        ports:
        - containerPort: 3002
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-agent-web
  namespace: knowledge-agent
spec:
  selector:
    app: knowledge-agent
    component: web
  ports:
  - port: 80
    targetPort: 3002
  type: LoadBalancer
