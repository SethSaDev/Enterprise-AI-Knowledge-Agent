events {
    worker_connections 1024;
}

http {
    upstream api_backend {
        least_conn;
        server knowledge-agent-api:3000 max_fails=3 fail_timeout=30s;
        server knowledge-agent-api:3000 max_fails=3 fail_timeout=30s;
        server knowledge-agent-api:3000 max_fails=3 fail_timeout=30s;
    }
    
    upstream ws_backend {
        least_conn;
        server knowledge-agent-api:3001 max_fails=3 fail_timeout=30s;
        server knowledge-agent-api:3001 max_fails=3 fail_timeout=30s;
        server knowledge-agent-api:3001 max_fails=3 fail_timeout=30s;
    }
    
    upstream web_backend {
        least_conn;
        server knowledge-agent-web:80 max_fails=3 fail_timeout=30s;
        server knowledge-agent-web:80 max_fails=3 fail_timeout=30s;
    }
    
    server {
        listen 80;
        server_name api.knowledge-agent.com;
        
        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    server {
        listen 80;
        server_name ws.knowledge-agent.com;
        
        location / {
            proxy_pass http://ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
    
    server {
        listen 80;
        server_name app.knowledge-agent.com;
        
        location / {
            proxy_pass http://web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
