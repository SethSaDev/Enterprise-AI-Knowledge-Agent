name: CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploying version ${GITHUB_REF#refs/tags/}"
          # Add actual deployment commands here
          # Example: kubectl set image deployment/api api=${{ secrets.DOCKER_USERNAME }}/knowledge-agent-api:${GITHUB_REF#refs/tags/}
